<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found | Neil Williams</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--moss:#dee3d1;--ink:#1e2418;--ink-soft:#4a5240;--ochre:#9a6526;--rule:#c2c9ae}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--moss);color:var(--ink);
  font-family:"Inter",-apple-system,Helvetica,Arial,sans-serif;font-weight:300;
  display:flex;align-items:center;justify-content:center;padding:40px;text-align:center}
.card{max-width:46ch}
.eyebrow{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--ochre);
  margin:0 0 20px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;
  font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.1;margin:0 0 20px}
p{color:var(--ink-soft);line-height:1.75;margin:0 0 34px}
a{display:inline-block;background:var(--ink);color:var(--moss);text-decoration:none;
  padding:15px 38px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  transition:background .3s,transform .3s}
a:hover{background:var(--ochre);transform:translateY(-2px)}
.rule{width:56px;height:1px;background:var(--rule);margin:0 auto 26px}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">404</p>
    <div class="rule"></div>
    <h1>This page<br>doesn't exist.</h1>
    <p>The link may have a typo in it, or the page may have been moved.</p>
    <a href="/">Back to the paintings</a>
  </div>
</body>
</html>
